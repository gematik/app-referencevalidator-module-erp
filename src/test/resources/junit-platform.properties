junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
#junit.jupiter.execution.parallel.config.executor-service=WORKER_THREAD_POOL
junit.jupiter.execution.parallel.config.executor-service=FORK_JOIN_POOL
# Strategy: fixed thread pool.
#
# WHY THIS VALUE:
#   Each unique NPM package set requires one preloaded FhirEngine (1-2 GB heap each).
#   Running too many test classes in parallel activates many different package sets
#   simultaneously, causing OutOfMemoryError.
#
#   parallelism=2 means that at most 2 test classes active at once
#
#   Increase to 3 or 4 only if you have ≥16 GB of heap available
#   (-Xmx16g or larger set via <jvm.argLine> in the parent pom).
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=8
